<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Макет сторінки — Float / Flex / Grid</title>

<style>
*{
    box-sizing: border-box;
}
body{
    margin: 0;
    font-family: Arial, sans-serif;
    padding: 10px;
    background: #f2f2f2;
}
h1{
    text-align: center;
}
.wrapper{
    background: #fff;
    padding: 10px;
    border-radius: 8px;
}

.blue  { background:#5B9BD5; }
.gray  { background:#6F7A7D; }
.cyan  { background:#69D2D0; }
.red   { background:#E57373; }
.yellow{ background:#FFC000; }
.green { background:#2E9E68; }
.brown { background:#C75A0A; }

.block{
    border:1px solid #dcdcdc;
    margin:3px;
    min-height:80px;
}

#grid{
    display:grid;
    grid-template-columns: 3fr 1fr;
    gap:6px;
}

#grid .header{ height:150px; grid-column:1/2; }
#grid .side{   height:150px; grid-column:2/3; }

#grid .small-a{ height:110px; }
#grid .small-b{ height:110px; }
#grid .medium{  height:110px; grid-column:1/3; }

#grid .green-row{ height:110px; grid-column:1/3; }
#grid .brown-row{ height:120px; grid-column:1/3; }

/* GRID adaptive */
@media (max-width:500px){
    #grid{
        grid-template-columns:1fr;
    }
    #grid .medium,
    #grid .green-row,
    #grid .brown-row{
        grid-column:1;
    }
}
</style>
</head>
<body>

<div class="wrapper" id="grid">

    <div class="block blue header"></div>
    <div class="block gray side"></div>

    <div class="block cyan small-a"></div>
    <div class="block red small-b"></div>
    <div class="block yellow medium"></div>

    <div class="block green green-row"></div>

    <div class="block brown brown-row"></div>

</div>

</body>
</html>
