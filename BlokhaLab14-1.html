<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 1 - Адаптивний макет</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        .main-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header, .footer, .content-block, .menu {
            border: 1px solid #dee2e6 !important;
            padding: 15px;
        }
        
        /* Кольори відповідно до зразка */
        .header-left {
            background-color: #f8f9fa;
            color: #333;
        }
        
        .header-right {
            background-color: #e9ecef;
            color: #333;
        }
        
        .left-menu {
            background-color: #d4edda;
            color: #155724;
        }
        
        .main-content {
            background-color: #fff3cd;
            color: #856404;
        }
        
        .right-menu {
            background-color: #d1ecf1;
            color: #0c5460;
        }
        
        .footer-left {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .footer-right {
            background-color: #e2e3e5;
            color: #383d41;
        }
        
        /* Висоти для повного заповнення */
        .content-row {
            flex: 1;
        }
        
        /* Адаптивність для різних розмірів */
        @media (max-width: 767.98px) {
            .header-left, .header-right {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid main-container p-0">
        <!-- Шапка -->
        <div class="row g-0">
            <div class="col-lg-6 header header-left">
                <div class="p-3">Левая часть шапки</div>
            </div>
            <div class="col-lg-6 header header-right">
                <div class="p-3">Правая часть шапки</div>
            </div>
        </div>

        <!-- Основний контент -->
        <div class="row g-0 content-row">
            <!-- Левое меню -->
            <div class="col-lg-2 col-md-3 left-menu menu">
                <div class="p-3">Левое меню</div>
            </div>
            
            <!-- Центральный контент -->
            <div class="col-lg-8 col-md-6 main-content">
                <div class="p-3 h-100">Контент</div>
            </div>
            
            <!-- Правое меню -->
            <div class="col-lg-2 col-md-3 right-menu menu">
                <div class="p-3">Правое меню</div>
            </div>
        </div>

        <!-- Подвал -->
        <div class="row g-0">
            <div class="col-lg-6 footer-left footer">
                <div class="p-3">Левая часть подвала</div>
            </div>
            <div class="col-lg-6 footer-right footer">
                <div class="p-3">Правая часть подвала</div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
